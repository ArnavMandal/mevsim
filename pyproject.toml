[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mevsim"
version = "0.1.0"
description = "Stylized multi-agent RL simulator of transaction ordering and MEV"
requires-python = ">=3.11"
dependencies = ["numpy>=1.25", "pyyaml", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
rl = ["gymnasium>=1.0", "stable-baselines3>=2.3", "pettingzoo>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
